<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Viewer - ドラッグ&ドロップでXMLをプレビュー</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📄 XML Viewer</h1>
            <p class="subtitle">XMLファイルをドラッグ&ドロップしてプレビュー表示</p>
        </header>

        <div id="dropZone" class="drop-zone">
            <div class="drop-zone-content">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h2>XMLファイルをここにドロップ</h2>
                <p>または</p>
                <button id="browseBtn" class="browse-btn">ファイルを選択</button>
                <input type="file" id="fileInput" accept=".xml" style="display: none;">
                <p class="hint">対応ファイル形式: .xml</p>
            </div>
        </div>

        <div id="viewerContainer" class="viewer-container hidden">
            <div class="viewer-header">
                <div class="file-info">
                    <span id="fileName" class="file-name"></span>
                    <span id="fileSize" class="file-size"></span>
                </div>
                <div class="actions">
                    <button id="copyBtn" class="action-btn" title="コピー">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        コピー
                    </button>
                    <button id="downloadBtn" class="action-btn" title="ダウンロード">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        ダウンロード
                    </button>
                    <button id="closeBtn" class="action-btn close-btn" title="閉じる">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        閉じる
                    </button>
                </div>
            </div>

            <div class="tabs">
                <button id="formTab" class="tab active">📋 帳票プレビュー</button>
                <button id="tableTab" class="tab">📊 テーブル表示</button>
                <button id="treeTab" class="tab">🌳 ツリー表示</button>
                <button id="rawTab" class="tab">📝 Raw XML</button>
            </div>

            <div id="formView" class="content-view">
                <div id="xmlForm" class="xml-form-container">
                    <div class="form-toolbar">
                        <button id="printFormBtn" class="form-btn">🖨️ 印刷</button>
                        <select id="formTemplateSelect" class="form-select">
                            <option value="auto">自動検出</option>
                            <option value="invoice">請求書</option>
                            <option value="insurance">社会保険料</option>
                            <option value="generic">汎用フォーム</option>
                        </select>
                    </div>
                    <div id="formContent" class="form-content"></div>
                </div>
            </div>

            <div id="tableView" class="content-view hidden">
                <div id="xmlTable" class="xml-table-container"></div>
            </div>

            <div id="treeView" class="content-view hidden">
                <div id="xmlTree" class="xml-tree"></div>
            </div>

            <div id="rawView" class="content-view hidden">
                <pre id="xmlRaw" class="xml-raw"></pre>
            </div>
        </div>
    </div>

    <script type="module" src="dist/index.js"></script>
</body>
</html>
